<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI WARP LENS</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<script>
  // Host-only page: plays the YouTube embed that the main window captures as real pixels.
  const src = new URLSearchParams(location.search).get('src') || '';
  let url = null;
  try {
    url = new URL(src);
  } catch (error) {
    console.error('AI WARP LENS: invalid embed URL.', error);
  }
  if (url && url.protocol === 'https:' &&
      ['www.youtube-nocookie.com', 'www.youtube.com'].includes(url.hostname) &&
      !url.username && !url.password && (!url.port || url.port === '443') &&
      (url.pathname === '/embed' || url.pathname.startsWith('/embed/'))) {
    const f = document.createElement('iframe');
    f.src = url.href;
    f.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
    f.allowFullscreen = true;
    f.referrerPolicy = 'strict-origin-when-cross-origin';
    document.body.appendChild(f);
  } else {
    console.error('AI WARP LENS: only HTTPS YouTube embeds are supported.');
    document.body.textContent = 'AI WARP LENS: invalid or unsupported YouTube embed URL.';
  }
</script>
</body>
</html>
